[project]
name = "mpk-cli"
version = "0.2.0"
description = "Command-line and TUI search for the MPK Koulutuskalenteri (koulutuskalenteri.mpk.fi)"
readme = "README.md"
requires-python = ">=3.11"
license = "0BSD"
license-files = ["LICENSE"]
authors = [{ name = "Heikki Manninen" }]
keywords = ["mpk", "koulutuskalenteri", "cli", "reservilaiset", "kongressi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Zero-Clause BSD (0BSD)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "typer>=0.12",
    "rich>=13.7",
    "rapidfuzz>=3.9",
    "platformdirs>=4.2",
    "python-dateutil>=2.9",
    "textual>=0.79",
    "pyperclip>=1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "textual-dev>=1.5",
]

[project.scripts]
mpk = "mpk.cli:app"

[project.urls]
Homepage = "https://github.com/hsmanninen/mpk-cli"
Changelog = "https://github.com/hsmanninen/mpk-cli/blob/main/CHANGELOG.md"
Documentation = "https://github.com/hsmanninen/mpk-cli#readme"
Issues = "https://github.com/hsmanninen/mpk-cli/issues"
Source = "https://github.com/hsmanninen/mpk-cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mpk"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
# We intentionally use en-dashes ("–") in strings and comments because that's
# what the MPK site emits and what we render back; suppress the ambiguity lints.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Textual widgets expose BINDINGS and DEFAULT_CSS as class attributes; the
# framework requires the list-literal form and reads them via metaclass magic.
"src/mpk/tui/*.py" = ["RUF012"]
"src/mpk/tui/**/*.py" = ["RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits the real MPK site (opt-in, skipped by default)",
]
addopts = "-ra --strict-markers -m 'not live'"
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["mpk"]

[tool.coverage.report]
show_missing = true
