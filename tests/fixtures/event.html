<!doctype html>
<html lang="fi">
<head>
  <title>Synteettinen Taisteluensiapu - Koulutuskalenteri</title>
  <meta property="og:title" content="Synteettinen Taisteluensiapu">
</head>
<body>
  <!-- Synthetic detail fixture. Names, addresses, prose, and ids are fictitious. -->
  <input name="EventId" value="SYNTHETIC-DETAIL">
  <div id="calendar_info_period">
    <span class="period-date">01.12.2026</span>
    <span class="period-date">02.12.2026</span>
    <span class="period-time">08.00-16.00</span>
  </div>
  <span class="cal_training_place">Esimerkkikeskus</span>
  <span class="cal_location">Harjoitustila A</span>
  <span class="cal_city">Testikaupunki</span>

  <select name="NetworkTargetGroups">
    <option value="3001">MPK:n sitoutuneet kouluttajat ja toimijat</option>
    <option value="3002">Reserviläiset</option>
  </select>

  <label class="calendar_label_bold">Koulutusmuoto:</label>
  <label class="calendar_label_info">Verkkokoulutus</label>
  <label class="calendar_label_bold">Kesto:</label>
  <label class="calendar_label_info">16 tuntia</label>
  <label class="calendar_label_bold">Hinta:</label>
  <label class="calendar_label_info">Maksuton</label>
  <label class="calendar_label_bold">Järjestäjä:</label>
  <label class="calendar_label_info">Synteettinen koulutusyksikkö</label>
  <label class="calendar_label_bold">Kurssin johtajan yhteystiedot:</label>
  <label class="calendar_label_info">Testihenkilö<br>testi@example.invalid</label>
  <label class="calendar_label_bold">Tapahtuman kuvaus:</label>
  <label class="calendar_label_info">Osallistuja perehtyy taisteluensiavun perusteisiin.</label>
  <label class="calendar_label_bold">Tavoitteet:</label>
  <label class="calendar_label_info">Osallistuja osaa toimia turvallisesti.<br>Osallistuja tunnistaa avuntarpeen.</label>
  <label class="calendar_label_bold">Kohderyhmä:</label>
  <label class="calendar_label_info">MPK:n sitoutuneet kouluttajat ja toimijat, Reserviläiset</label>
  <label class="calendar_label_info">Kurssi on tarkoitettu harjoitteleville reserviläisille.</label>
  <label class="calendar_label_bold">Keskeinen sisältö:</label>
  <label class="calendar_label_info"><p>Synteettinen opetuspaketti sisältää ensiapuharjoituksia.</p><p>Kaikki esimerkit ovat kuvitteellisia.</p></label>

  <div class="label_container">
    <a class="button_green" href="https://ilmoittautuminen.mpk.fi/Registration/Login?id=SYNTHETIC">Ilmoittautumislomake</a>
    <label>Avoinna 06.12.2026 18.00 saakka</label>
  </div>
</body>
</html>
